
name: Build su Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare project
        run: |
          if [ -f su_android_project.zip ]; then
            unzip -o su_android_project.zip
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f su_android/gradlew ]; then
            chmod +x su_android/gradlew
            ./su_android/gradlew -p su_android assembleDebug
          else
            echo "Gradle wrapper bulunamadi"
            exit 1
          fi
          
      - name: Fix Java JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path("su_android"), Path(".")]
          for root in roots:
              gradle_file = root / "app" / "build.gradle"
              if not gradle_file.exists():
                  gradle_file = root / "app" / "build.gradle.kts"
              if gradle_file.exists():
                  text = gradle_file.read_text()
                  text = text.replace(
                      "JavaVersion.VERSION_1_8",
                      "JavaVersion.VERSION_17"
                  )
                  gradle_file.write_text(text)
                  print("Updated:", gradle_file)
                  break
          else:
              raise SystemExit("app/build.gradle bulunamadi")
          PY


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: su-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
